[package]
name = "devbench"
version = "0.1.0"
description = "Control center for home servers and their virtual machines"
authors = ["DevBench contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MosesCommitsFraud/DevBench"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65.4", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "io-std"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.3"
dirs = "7.0.0"
getrandom = "0.3"
anyhow = "1.0.105"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
log = "0.4.35"
ssh2-config = "0.9.0"
russh-sftp = "4.0.0"
rmcp = { version = "3.12.0", features = ["server", "transport-io", "macros"] }
vnc-rs = "0.6.1"
schemars = "1.2.3"
png = "0.18.1"
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
